<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links em HTML</title>
    <style>
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: brown;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: green;
        }
        a:hover {
            color: aqua;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }
        a::after {
            content: '🔗';
            text-decoration: none;
            font-weight: normal;
            color: black;
        }
    </style>
    
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <a href="https://github.com/gustavoguanabara"><li>Repositório GutHub</li></a>
        <a href="https://www.youtube.com/@cursoemvideo"><li>Canal do YouTube</li></a>
        <a href="https://www.cursoemvideo.com/"><li>Site do CuirsoemVideo</li></a>
    </ul>
    
</body>
</html>
