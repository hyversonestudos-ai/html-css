<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e Quebras de Linhas.</h1>
    <hr>
    <p>Você pode escrever um Parágrafo de qualquer jeito, basta colocar  tudo no meio do par de tag &lt;p&gt; e &lt;/p&gt;. </p>
    <p>Vamos Adicionar alguns símbolos especiais:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &delta; <!-- Delta minusculo-->
        &Delta; <!-- Delta maiusculo-->
        &uparrow;
    </p>
    <p>Também é póssivel Adicionar emojis no site:
        <br>
        Exemplo de como por um emjo no site: 
        &#x1F604;
    </p>
    
    
</body>
</html>
