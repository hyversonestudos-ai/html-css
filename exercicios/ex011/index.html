<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinamicas</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>As imagens abaixo irão ser responsivas de acordo com o tamanho do seu navegador ou dispositivo</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="A imagem flexível funciona">
    </picture>
    <h2>Audios no HMTL</h2>
    <audio preload="metadata" controls>
        <source src="midia/happy-mistake.mp3" type="audio/mp3">
    </audio>
    
    
</body>
</html>
