<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>
<body>
    <h1>Exemplos de Formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="idnumero1">Número 1: </label>
            <input type="number" name="nnumero1" id="idnumero1" min="0" max="50" required oninput="isoma.innerHTML = Number(idnumero1.value) + Number(idnumero2.value)">
        </p>
        <p>
            <label for="idnumero2">Número 2: </label>
            <input type="number" name="nnumero2" id="idnumero2" min="0" max="50" required oninput="isoma.innerHTML = Number(idnumero1.value) + Number(idnumero2.value)">
        </p>
        <p>
            <label for="isoma">Soma: </label>
            <output name="soma" id="isoma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar Dados">
            <input type="reset" value="Limpar Dados">
        </p>
    </form> 
    
</body>
</html>
