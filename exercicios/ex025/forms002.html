<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h1>TESTE DE FORMULÁRIO</h1>
    <form action="cadastro.php" method="POST" autocomplete="off">
        <p>
            <label for="iusuario">Usuário:</label>
            <input type="text" name="nusuario" id="idusuario" required minlength="5" maxlength="20" size="20" placeholder="Nome Completo" autocomplete="username" >

            
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="nsenha" id="idsenha" required minlength="5" maxlength="20" size="20" placeholder="Nome Completo" autocomplete="current-password">

        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
